<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Periodic Table Non-Metals Finder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">🏎️ ICT 10 Showcase</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Home (SW1)</a>
                <a class="nav-link active" href="element.html">Element Checker</a>
                <a class="nav-link" href="clubs.html">Club Members</a>
                <a class="nav-link" href="creator.html">Meet the Creator</a>
            </div>
        </div>
    </nav>

    <div class="container main-container mt-4">
        <h1>Periodic Table Finder</h1>
        <p>Enter any non-metal symbol to lookup element details.</p>

        <form onsubmit="return false;">
            <div class="mb-3">
                <input type="text" id="symbol-input" class="form-control" placeholder="e.g. H, O, C" autocomplete="off">
            </div>
            <button class="btn btn-primary w-100" py-click="search_element">Search</button>
        </form>

        <div id="output" class="result-box mt-3">Element details will appear here.</div>
    </div>

    <script type="py" src="element.py"></script>
</body>
</html>
